<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaining Selectors</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Use the classes BELOW this line -->
    <div>
      <img class="avatar proportioned" src="https://images.unsplash.com/photo-1706391740145-19c93b1cda9a?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Woman with glasses">
      <img class="avatar distorted" src="https://media.istockphoto.com/id/1422845856/photo/man-standing-and-looking-at-camera-raising-his-eyeglasses-sees-something-astonishing.jpg?s=612x612&w=0&k=20&c=nksRYwLInApEgzyqdX4ha3rxg54ynxPMmOAaAG82izo=" alt="Man with surprised expression">
    </div>
    <!-- Use the classes ABOVE this line -->
    <div>
      <img class="original proportioned" src="https://images.unsplash.com/photo-1706391740145-19c93b1cda9a?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Woman with glasses">
      <img class="original distorted" src="https://media.istockphoto.com/id/1422845856/photo/man-standing-and-looking-at-camera-raising-his-eyeglasses-sees-something-astonishing.jpg?s=612x612&w=0&k=20&c=nksRYwLInApEgzyqdX4ha3rxg54ynxPMmOAaAG82izo=" alt="Man with surprised expression">
    </div>
  </body>
</html>
